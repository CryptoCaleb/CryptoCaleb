<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3570"/><stop offset="1" stop-color="#1b1838"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a12"/><stop offset="1" stop-color="#06100b"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:'Courier New',monospace;font-weight:700;fill:#8bf5a8}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .float{animation:f 4s ease-in-out infinite}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .star{animation:s 2.4s linear infinite}
      @keyframes s{from{transform:translateX(0)}to{transform:translateX(-196px)}}
      .led{animation:l 2s ease-in-out infinite}
      @keyframes l{50%{fill:#ff4d8d}}
      .press{animation:p 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes p{0%,80%,100%{transform:scale(1)}90%{transform:scale(.85)}}
    </style>
  </defs>
  <g class="float">
    <rect x="60" y="20" width="300" height="260" rx="22" fill="url(#body)" stroke="#a78bfa" stroke-opacity=".5" stroke-width="2"/>
    <rect x="82" y="38" width="256" height="150" rx="10" fill="#0f0c29"/>
    <circle class="led" cx="96" cy="52" r="3.5" fill="#a78bfa"/>
    <svg x="112" y="50" width="196" height="126">
      <rect width="196" height="126" fill="url(#scr)"/>
      <g class="star" fill="#8bf5a8" opacity=".55">
        <rect x="20" y="18" width="2" height="2"/><rect x="70" y="40" width="2" height="2"/><rect x="130" y="14" width="2" height="2"/><rect x="170" y="56" width="2" height="2"/>
        <rect x="216" y="18" width="2" height="2"/><rect x="266" y="40" width="2" height="2"/><rect x="326" y="14" width="2" height="2"/><rect x="366" y="56" width="2" height="2"/>
      </g>
      <text x="98" y="62" text-anchor="middle" class="t" font-size="26" filter="url(#glow)">CALEB</text>
      <text x="98" y="80" text-anchor="middle" class="t" font-size="9" opacity=".75">FULL-STACK ENGINEER</text>
      <text x="98" y="108" text-anchor="middle" class="t blink" font-size="11">▶ PRESS START</text>
      <rect width="196" height="126" fill="url(#scan)"/>
    </svg>
    <g fill="#0f0c29">
      <rect x="100" y="212" width="16" height="48" rx="3"/><rect x="84" y="228" width="48" height="16" rx="3"/>
    </g>
    <circle class="press" cx="300" cy="222" r="13" fill="#ff4d8d"/>
    <circle cx="272" cy="244" r="13" fill="#a78bfa"/>
    <text x="300" y="227" text-anchor="middle" font-family="monospace" font-weight="700" font-size="12" fill="#1b1838">A</text>
    <text x="272" y="249" text-anchor="middle" font-family="monospace" font-weight="700" font-size="12" fill="#1b1838">B</text>
    <rect x="178" y="250" width="24" height="7" rx="3.5" fill="#0f0c29"/><rect x="214" y="250" width="24" height="7" rx="3.5" fill="#0f0c29"/>
  </g>
</svg>
