<rect class="grow" style="animation-delay:320ms" x="269.7" y="55" width="3.2" height="10" fill="#663399"/>
<rect class="grow" style="animation-delay:400ms" x="272.9" y="55" width="2.1" height="10" fill="#89e051"/>
</g>
