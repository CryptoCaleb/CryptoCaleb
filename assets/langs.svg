<svg xmlns="http://www.w3.org/2000/svg" width="300" height="215" viewBox="0 0 300 215">
<style>
  .fade{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
  .grow{transform-origin:left;transform:scaleX(0);animation:g 1s ease-out forwards}
  @keyframes g{to{transform:scaleX(1)}}
  .draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:d 2.2s ease-out forwards}
  @keyframes d{to{stroke-dashoffset:0}}
</style>
<rect x="0.5" y="0.5" width="299" height="214" rx="14" fill="#0f0c29" stroke="#302b63"/>
<text x="25" y="36" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif" font-size="18" font-weight="700" fill="#a78bfa">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="55" width="250" height="10" rx="5"/></clipPath><g clip-path="url(#bar)">
<rect class="grow" style="animation-delay:0ms" x="25.0" y="55" width="147.9" height="10" fill="#dea584"/>
<rect class="grow" style="animation-delay:80ms" x="172.9" y="55" width="69.9" height="10" fill="#3572A5"/>
